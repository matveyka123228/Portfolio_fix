{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">
    <script>
        document.documentElement.classList.add('js');
        // Тема применяется сразу в <head>, чтобы страница не мигала при загрузке
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
</head>
<body class = "bg-light">
    <header class = "navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <a class = "navbar-brand" href="{% url 'home' %}">My Portfolio</a>
        <button class = "navbar-toggler" type = "button" data-bs-toggle = "collapse" data-bs-target = "#navbarNav" aria-controls = "navbarNav" aria-expanded = "false" aria-label = "Toggle navigation">
            <span class = "navbar-toggler-icon"></span>
        </button>
        <nav class = "container">
            <ul class = "navbar-nav">
                <li class = "nav-item">
                    <a class = "nav-link" href="{% url 'home' %}">Home</a>
                </li>
                <li class = "nav-item">
                    <a class = "nav-link" href="{% url 'projects' %}">Projects</a>
                </li>
                <li class = "nav-item">
                    <a class = "nav-link" href="{% url 'skills' %}">Skills</a>
                </li>
                <li class = "nav-item ms-2">
                    <button type = "button" id = "theme-toggle" class = "theme-toggle" aria-label = "Переключить тему">
                        <svg class = "icon-moon" viewBox = "0 0 24 24" fill = "none" stroke = "currentColor" stroke-width = "2" stroke-linecap = "round" stroke-linejoin = "round" aria-hidden = "true"><path d = "M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                        <svg class = "icon-sun" viewBox = "0 0 24 24" fill = "none" stroke = "currentColor" stroke-width = "2" stroke-linecap = "round" stroke-linejoin = "round" aria-hidden = "true"><circle cx = "12" cy = "12" r = "4"></circle><path d = "M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class = "text-center py-4 text-muted bg-white border-top">
        <div class = "container">
            <p>&copy; 2023 My Portfolio. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Плавное появление элементов с классом .reveal, по одному
        (function () {
            var items = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) {
                items.forEach(function (el) { el.classList.add('is-visible'); });
                return;
            }
            var observer = new IntersectionObserver(function (entries) {
                var n = 0;
                entries.forEach(function (entry) {
                    if (!entry.isIntersecting) return;
                    entry.target.style.transitionDelay = (n * 150) + 'ms';
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                    n++;
                });
            }, { threshold: 0.15 });
            items.forEach(function (el) { observer.observe(el); });
        })();
    </script>
    <script>
        // Кнопка переключения светлой/тёмной темы
        (function () {
            var btn = document.getElementById('theme-toggle');
            var root = document.documentElement;
            btn.addEventListener('click', function () {
                var next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-bs-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        })();
    </script>
</body>
</html>
